name: Build and Deploy RunPod Image
on:
  push:
    branches: [main]
    paths: ['runpod/**']
  workflow_dispatch:
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./runpod
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/slice-lemonade:latest
          ghcr.io/${{ github.repository_owner }}/slice-lemonade:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Update RunPod Template (Manual Step Reminder)
      run: |
        echo "✅ Docker image built and pushed to GHCR"
        echo "📦 Image: ghcr.io/${{ github.repository_owner }}/slice-lemonade:latest"
        echo ""
        echo "🚀 MANUAL DEPLOYMENT REQUIRED:"
        echo "1. Go to RunPod Console: https://www.runpod.io/console/serverless"
        echo "2. Find Slice Lemonade template"
        echo "3. Edit template → Update Docker image to:"
        echo "   ghcr.io/${{ github.repository_owner }}/slice-lemonade:latest"
        echo "4. Save template"
        echo "5. Go to Endpoints: https://www.runpod.io/console/endpoints"
        echo "6. Find endpoint 8y3bd1tz05fj3p"
        echo "7. Click 'Refresh'"
        echo "8. Wait 3-5 minutes for workers to update"