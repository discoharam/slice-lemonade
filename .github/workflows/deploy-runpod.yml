name: Deploy to RunPod

on:
  push:
    branches: [ main ]
    paths:
      - "backend/runpod/**"
      - ".github/workflows/deploy-runpod.yml"
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: production
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./backend/runpod
        push: true
        tags: |
          ghcr.io/discoharam/slice-lemonade:latest
          ghcr.io/discoharam/slice-lemonade:${{ github.sha }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Deploy to RunPod
      run: |
        echo "✅ Docker image built successfully!"
        echo ""
        echo "📋 NEXT STEPS (Manual):"
        echo "1. Go to https://runpod.io/console/serverless"
        echo "2. Open endpoint 'whast4iifdcn9r'"
        echo "3. Click 'Refresh' to pull latest image"
        echo "4. Wait 2-3 minutes for deployment"
        echo "5. Test with: python backend/test_now.py"
        echo ""
        echo "📦 Image: ghcr.io/discoharam/slice-lemonade:latest"