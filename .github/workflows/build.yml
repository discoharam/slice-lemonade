# Save this content to .github/workflows/build.yml
cd "C:\DEV\Slice Lemonade"

# Create the fixed file
@'
name: Build Docker Image

on:
  push:
    branches: [ main ]
    paths:
      - 'runpod/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Login to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Build and push Docker image
      uses: docker/build-push-action@v5
      with:
        context: ./runpod
        push: true
        tags: |
          ghcr.io/discoharam/slice-lemonade:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Verify
      run: |
        echo "✅ Docker image built and pushed!"
        echo "📦 Image: ghcr.io/discoharam/slice-lemonade:latest"
        echo "🔗 View at: https://github.com/discoharam/slice-lemonade/pkgs/container/slice-lemonade"
'@ | Set-Content -Path ".github/workflows/build.yml" -Encoding UTF8